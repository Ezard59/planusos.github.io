<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Zajęć USOS</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --live: #22c55e;
            --next: #eab308;
            --danger: #ef4444;
            --border: #334155;

            /* Kolory typów zajęć */
            --type-w: #a855f7;   /* Fioletowy - Wykład */
            --type-lab: #06b6d4; /* Cyjan - Laboratorium */
            --type-cw: #f97316;  /* Pomarańczowy - Ćwiczenia */
            --type-inne: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
            user-select: none; /* Zapobiega przypadkowemu zaznaczaniu tekstu podczas swipe'owania */
            overflow-x: hidden;
        }
        
        /* Pływające, "jebitnie wielkie" przyciski na bokach */
        .side-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(60px, 8vw, 100px); /* Dynamiczna, duża szerokość */
            height: 40vh; /* Zajmują 40% wysokości ekranu */
            background: rgba(30, 41, 59, 0.4);
            border: 2px solid var(--border);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem; /* Ogromna strzałka */
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(10px); /* Mocniejsze rozmycie tła */
            opacity: 0.6;
            transition: all 0.2s ease-in-out;
        }
        .side-nav:hover, .side-nav:active {
            opacity: 1;
            background: rgba(56, 189, 248, 0.2);
            width: clamp(75px, 10vw, 120px); /* Powiększają się po najechaniu */
        }
        .side-nav.left {
            left: 0;
            border-left: none;
            border-radius: 0 24px 24px 0;
        }
        .side-nav.right {
            right: 0;
            border-right: none;
            border-radius: 24px 0 0 24px;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            gap: 14px;
            text-align: center;
        }
        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 28px 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input[type="password"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            user-select: text;
        }
        input[type="password"]:focus { border-color: var(--accent); }
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            display: none;
        }
        #app-screen { display: none; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: 1.35rem; }
        .btn-group { display: flex; gap: 8px; }
        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button.btn-logout {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        button:active { opacity: 0.8; }
        .status {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 14px;
        }

        /* Pasek nawigacji - czysty, wyśrodkowany */
        .month-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .month-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: capitalize;
        }

        /* Legenda typów zajęć */
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Baner odliczania na górze */
        .hero-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        .hero-banner.is-live { border-color: var(--live); }
        .hero-banner.is-next { border-color: var(--next); }
        .hero-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 700;
        }
        .hero-title { font-size: 1.15rem; font-weight: 700; }
        .hero-timer {
            font-size: 1.35rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        /* Dni i kafelki */
        .day-group {
            margin-bottom: 20px;
            padding: 4px;
            border-radius: 12px;
        }
        .day-group.today-group {
            background: rgba(56, 189, 248, 0.04);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 14px;
        }
        .day-header {
            font-size: 1.05rem;
            color: var(--accent);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 999px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-today { background: var(--accent); color: #0f172a; }
        .badge-live { background: var(--live); color: #052e16; animation: pulse 2s infinite; }
        .badge-next { background: var(--next); color: #422006; }

        /* Plakietki typu zajęć */
        .type-badge {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .type-w { background: rgba(168, 85, 247, 0.18); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4); }
        .type-lab { background: rgba(6, 182, 212, 0.18); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4); }
        .type-cw { background: rgba(249, 115, 22, 0.18); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.4); }
        .type-inne { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; border: 1px solid rgba(100, 116, 139, 0.4); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        .event-card {
            background: var(--card);
            border: 2px solid var(--type-inne);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: opacity 0.2s;
            position: relative;
            z-index: 1;
        }
        .event-card.card-w { border-color: var(--type-w); }
        .event-card.card-lab { border-color: var(--type-lab); }
        .event-card.card-cw { border-color: var(--type-cw); }

        .event-card.past-event {
            opacity: 0.42;
        }
        .event-card.live-event {
            border-color: var(--live) !important;
            border-width: 2.5px;
            background: rgba(34, 197, 94, 0.08);
        }
        .event-card.next-event {
            border-color: var(--next) !important;
            border-width: 2.5px;
        }
        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .event-top-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .event-time {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
        }
        .live-event .event-time { color: var(--live); }
        .next-event .event-time { color: var(--next); }
        .event-title {
            font-size: 1.08rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .event-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .room-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .room-pill.is-remote {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.45);
            color: #7dd3fc;
        }
        .teacher-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #e9d5ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        /* Pasek postępu */
        .progress-wrap {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--live);
            border-radius: 999px;
            transition: width 1s linear;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--live);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 Dostęp do planu</h2>
            <p style="font-size: 0.85rem; color: var(--muted);">Wpisz hasło jednorazowo, aby odblokować i zapamiętać urządzenie.</p>
            <input type="password" id="pass-input" placeholder="Hasło..." autocapitalize="none" autocorrect="off" onkeydown="if(event.key==='Enter') zaloguj()">
            <div id="login-error" class="error-msg">Nieprawidłowe hasło!</div>
            <button type="button" onclick="zaloguj()">Odblokuj</button>
        </div>
    </div>

    <div id="app-screen">
        
        <!-- Pływające przyciski nawigacyjne po bokach -->
        <div class="side-nav left" onclick="zmienMiesiac(-1)">◀</div>
        <div class="side-nav right" onclick="zmienMiesiac(1)">▶</div>

        <header>
            <h1>🎓 Mój Plan USOS</h1>
            <div class="btn-group">
                <button type="button" onclick="pobierzPlan()">🔄 Odśwież</button>
                <button type="button" class="btn-logout" onclick="wyloguj()">Wyloguj</button>
            </div>
        </header>

        <div id="status" class="status">Ładowanie planu...</div>

        <!-- Górny panel na żywo -->
        <div id="hero-banner" class="hero-banner"></div>

        <!-- Pasek nawigacji - czysty, wyśrodkowany -->
        <div class="month-nav">
            <div id="current-month-title" class="month-title">Wczytywanie...</div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="legend-dot" style="background: var(--type-w)"></span> Wykład</div>
            <div class="legend-item"><span class="legend-dot" style="background: var(--type-lab)"></span> Laboratorium</div>
            <div class="legend-item"><span class="legend-dot" style="background: var(--type-cw)"></span> Ćwiczenia</div>
        </div>

        <div id="plan-container"></div>
    </div>

    <script>
        const STORAGE_AUTH_KEY = "usos_logged_in_v3";
        let WSZYSTKIE_ZAJECIA = [];
        let dostepneMiesiace = [];
        let aktualnyIndeksMiesiaca = 0;
        let timerInterval = null;

        function sprawdzHaslo(wpisane) {
            return wpisane && wpisane.trim().toLowerCase() === "lol123";
        }

        function zaloguj() {
            const input = document.getElementById("pass-input").value;
            const errorEl = document.getElementById("login-error");
            errorEl.style.display = "none";
            if (sprawdzHaslo(input)) {
                localStorage.setItem(STORAGE_AUTH_KEY, "true");
                uruchomAplikacje();
            } else {
                errorEl.style.display = "block";
            }
        }

        function wyloguj() {
            localStorage.removeItem(STORAGE_AUTH_KEY);
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById("pass-input").value = "";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
        }

        function uruchomAplikacje() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";

            const zapisany = localStorage.getItem("usos_ics_cache");
            if (zapisany) {
                WSZYSTKIE_ZAJECIA = parsujICS(zapisany);
                inicjalizujMiesiace();
                wyswietlPlan();
            }
            pobierzPlan();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(aktualizujLicznikiNaZywo, 1000);
        }

        function parsujDateICal(icalStr) {
            const czystaData = icalStr.split(':').pop().trim();
            const r = parseInt(czystaData.substring(0, 4), 10);
            const m = parseInt(czystaData.substring(4, 6), 10) - 1;
            const d = parseInt(czystaData.substring(6, 8), 10);
            const godz = parseInt(czystaData.substring(9, 11) || "0", 10);
            const min = parseInt(czystaData.substring(11, 13) || "0", 10);
            return new Date(r, m, d, godz, min);
        }

        function rozpoznajTypZajec(rawSummary) {
            const s = (rawSummary || "").trim();
            if (/^(W|Wyk|Wykład)\s*[-–:]/i.test(s)) return { kod: 'w', etykieta: '📖 Wykład', czystaNazwa: s.replace(/^(W|Wyk|Wykład)\s*[-–:]\s*/i, '') };
            if (/^(Lab|Laboratorium)\s*[-–:]/i.test(s)) return { kod: 'lab', etykieta: '🔬 Laboratorium', czystaNazwa: s.replace(/^(Lab|Laboratorium)\s*[-–:]\s*/i, '') };
            if (/^(Ćw|Cw|Ć|C|Ćwiczenia|Konw|Proj)\s*[-–:]/i.test(s)) return { kod: 'cw', etykieta: '✏️ Ćwiczenia', czystaNazwa: s.replace(/^(Ćw|Cw|Ć|C|Ćwiczenia|Konw|Proj)\s*[-–:]\s*/i, '') };
            return { kod: 'inne', etykieta: '🎓 Zajęcia', czystaNazwa: s };
        }

        function wyciagnijSale(rawDescription, rawLocation) {
            const tekst = `${rawDescription || ""} | ${rawLocation || ""}`;
            const matchSala = tekst.match(/Sala:\s*([^|\n\r]+)/i);
            let sala = matchSala ? matchSala[1].trim() : "";
            if (!sala && /teams|zdaln|online/i.test(tekst)) sala = "Teams";
            if (!sala) return { tekst: "📍 Brak sali", zdalnie: false };
            if (/teams|zdaln|online/i.test(sala)) return { tekst: "💻 ZDALNIE (Teams)", zdalnie: true };
            return { tekst: `📍 Sala ${sala}`, zdalnie: false };
        }

        function wyciagnijProwadzacego(rawDescription) {
            if (!rawDescription) return "";
            const match = rawDescription.match(/Prowadzący:\s*([^|\n\r]+)/i);
            return match ? match[1].trim() : "";
        }

        function parsujICS(icsText) {
            const unfolded = icsText.replace(/\r?\n[ \t]/g, '');
            const lines = unfolded.split(/\r?\n/);
            const zajecia = [];
            let obecne = null;
            for (let line of lines) {
                if (line === "BEGIN:VEVENT") obecne = {};
                else if (line === "END:VEVENT" && obecne) {
                    if (obecne.start && obecne.summary) {
                        const typInfo = rozpoznajTypZajec(obecne.summary);
                        obecne.typKod = typInfo.kod;
                        obecne.typEtykieta = typInfo.etykieta;
                        obecne.czystaNazwa = typInfo.czystaNazwa;
                        const salaInfo = wyciagnijSale(obecne.description, obecne.location);
                        obecne.salaTekst = salaInfo.tekst;
                        obecne.czyZdalnie = salaInfo.zdalnie;
                        obecne.prowadzacy = wyciagnijProwadzacego(obecne.description);
                        zajecia.push(obecne);
                    }
                    obecne = null;
                } else if (obecne) {
                    if (line.startsWith("SUMMARY:")) obecne.summary = line.substring(8).replace(/\\,/g, ',');
                    else if (line.startsWith("LOCATION:")) obecne.location = line.substring(9).replace(/\\,/g, ',');
                    else if (line.startsWith("DESCRIPTION:")) obecne.description = line.substring(12).replace(/\\n/g, ' | ').replace(/\\,/g, ',');
                    else if (line.startsWith("DTSTART")) obecne.start = parsujDateICal(line);
                    else if (line.startsWith("DTEND")) obecne.end = parsujDateICal(line);
                }
            }
            return zajecia.sort((a, b) => a.start - b.start);
        }

        function inicjalizujMiesiace() {
            const zestawMiesiecy = new Set();
            WSZYSTKIE_ZAJECIA.forEach(z => {
                const rok = z.start.getFullYear();
                const miesiac = String(z.start.getMonth() + 1).padStart(2, '0');
                zestawMiesiecy.add(`${rok}-${miesiac}`);
            });
            dostepneMiesiace = Array.from(zestawMiesiecy).sort();
            const teraz = new Date();
            const rokTeraz = teraz.getFullYear();
            const miesiacTeraz = String(teraz.getMonth() + 1).padStart(2, '0');
            const kluczBiezacy = `${rokTeraz}-${miesiacTeraz}`;
            const znalezionyIndeks = dostepneMiesiace.indexOf(kluczBiezacy);
            if (znalezionyIndeks !== -1) aktualnyIndeksMiesiaca = znalezionyIndeks;
            else {
                const przyszlyIndeks = dostepneMiesiace.findIndex(m => m > kluczBiezacy);
                aktualnyIndeksMiesiaca = przyszlyIndeks !== -1 ? przyszlyIndeks : (dostepneMiesiace.length > 0 ? 0 : -1);
            }
        }

        function zmienMiesiac(kierunek) {
            if (dostepneMiesiace.length === 0) return;
            aktualnyIndeksMiesiaca += kierunek;
            if (aktualnyIndeksMiesiaca < 0) aktualnyIndeksMiesiaca = dostepneMiesiace.length - 1;
            if (aktualnyIndeksMiesiaca >= dostepneMiesiace.length) aktualnyIndeksMiesiaca = 0;
            wyswietlPlan();
        }

        function czyTenSamDzien(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        }

        function formatujOdliczanie(ms) {
            if (ms <= 0) return "0s";
            const sek = Math.floor(ms / 1000) % 60;
            const min = Math.floor(ms / 60000) % 60;
            const godz = Math.floor(ms / 3600000) % 24;
            const dni = Math.floor(ms / 86400000);
            const czesci = [];
            if (dni > 0) czesci.push(`${dni}d`);
            if (godz > 0 || dni > 0) czesci.push(`${godz}h`);
            czesci.push(`${min}m ${sek < 10 ? '0' + sek : sek}s`);
            return czesci.join(" ");
        }

        function wyswietlPlan() {
            const container = document.getElementById("plan-container");
            const titleEl = document.getElementById("current-month-title");
            container.innerHTML = "";
            const teraz = new Date();

            if (WSZYSTKIE_ZAJECIA.length === 0 || dostepneMiesiace.length === 0) {
                titleEl.textContent = "Brak miesięcy";
                container.innerHTML = "<p style='color:var(--muted);'>Brak nadchodzących zajęć w pliku plan.ics.</p>";
                document.getElementById("hero-banner").style.display = "none";
                return;
            }

            const wybraneKluczMiesiaca = dostepneMiesiace[aktualnyIndeksMiesiaca];
            const [rokStr, miesStr] = wybraneKluczMiesiaca.split('-');
            const dataMiesiacaRef = new Date(parseInt(rokStr), parseInt(miesStr) - 1, 1);
            titleEl.textContent = dataMiesiacaRef.toLocaleDateString('pl-PL', { month: 'long', year: 'numeric' });

            const zajeciaWpisuMiesiaca = WSZYSTKIE_ZAJECIA.filter(z => {
                const zRok = z.start.getFullYear();
                const zMies = String(z.start.getMonth() + 1).padStart(2, '0');
                return `${zRok}-${zMies}` === wybraneKluczMiesiaca;
            });

            if (zajeciaWpisuMiesiaca.length === 0) {
                container.innerHTML = "<p style='color:var(--muted);'>Brak zajęć w tym miesiącu.</p>";
                aktualizujLicznikiNaZywo();
                return;
            }

            const grupy = new Map();
            zajeciaWpisuMiesiaca.forEach((z, idx) => {
                const kluczDnia = z.start.toLocaleDateString('pl-PL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                if (!grupy.has(kluczDnia)) grupy.set(kluczDnia, { data: z.start, lista: [] });
                grupy.get(kluczDnia).lista.push(z);
            });

            for (const [dzienTekst, grupa] of grupy.entries()) {
                const dzisiaj = czyTenSamDzien(grupa.data, teraz);
                const dayDiv = document.createElement("div");
                dayDiv.className = "day-group" + (dzisiaj ? " today-group" : "");
                dayDiv.innerHTML = `<div class="day-header"><span>${dzienTekst}</span>${dzisiaj ? '<span class="badge badge-today">Dzisiaj</span>' : ''}</div>`;
                grupa.lista.forEach(z => {
                    const startGodz = z.start.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
                    const endGodz = z.end ? z.end.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) : "";
                    const card = document.createElement("div");
                    card.className = `event-card card-${z.typKod}`;
                    card.id = `event-card-${z._id}`;
                    card.innerHTML = `
                        <div class="event-top">
                            <div class="event-top-left">
                                <span class="event-time">🕒 ${startGodz} - ${endGodz}</span>
                                <span class="type-badge type-${z.typKod}">${z.typEtykieta}</span>
                            </div>
                            <div id="event-badge-${z._id}"></div>
                        </div>
                        <div class="event-title">${z.czystaNazwa}</div>
                        <div class="event-meta">
                            <span class="room-pill ${z.czyZdalnie ? 'is-remote' : ''}">${z.salaTekst}</span>
                            ${z.prowadzacy ? `<span class="teacher-pill">👨‍🏫 ${z.prowadzacy}</span>` : ''}
                        </div>
                        <div id="event-progress-${z._id}"></div>
                    `;
                    dayDiv.appendChild(card);
                });
                container.appendChild(dayDiv);
            }
            aktualizujLicznikiNaZywo();
        }

        function aktualizujLicznikiNaZywo() {
            if (WSZYSTKIE_ZAJECIA.length === 0) return;
            const teraz = new Date();
            let trwajace = null;
            let nastepne = null;

            WSZYSTKIE_ZAJECIA.forEach((z, idx) => {
                z._id = idx;
                const card = document.getElementById(`event-card-${z._id}`);
                const badgeBox = document.getElementById(`event-badge-${z._id}`);
                const progressBox = document.getElementById(`event-progress-${z._id}`);

                if (card && badgeBox && progressBox) {
                    card.classList.remove("past-event", "live-event", "next-event");
                    badgeBox.innerHTML = "";
                    progressBox.innerHTML = "";
                    if (z.end && teraz >= z.end) card.classList.add("past-event");
                    else if (z.end && teraz >= z.start && teraz < z.end) {
                        trwajace = z;
                        card.classList.add("live-event");
                        badgeBox.innerHTML = `<span class="badge badge-live">Trwa teraz</span>`;
                        const calkowityCzas = z.end - z.start;
                        const minelo = teraz - z.start;
                        const procent = Math.min(100, Math.max(0, Math.round((minelo / calkowityCzas) * 100)));
                        const doKonca = formatujOdliczanie(z.end - teraz);
                        progressBox.innerHTML = `
                            <div class="progress-wrap">
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${procent}%"></div></div>
                                <div class="progress-info"><span>Postęp: ${procent}%</span><span>Koniec za: ${doKonca}</span></div>
                            </div>
                        `;
                    }
                }
                if (teraz < z.start && !nastepne) nastepne = z;
            });

            if (nastepne) {
                const nextCard = document.getElementById(`event-card-${nastepne._id}`);
                const nextBadge = document.getElementById(`event-badge-${nastepne._id}`);
                if (nextCard && nextBadge) {
                    nextCard.classList.add("next-event");
                    nextBadge.innerHTML = `<span class="badge badge-next">Start za ${formatujOdliczanie(nastepne.start - teraz)}</span>`;
                }
            }

            const hero = document.getElementById("hero-banner");
            if (trwajace) {
                const calkowity = trwajace.end - trwajace.start;
                const procent = Math.min(100, Math.max(0, Math.round(((teraz - trwajace.start) / calkowity) * 100)));
                hero.style.display = "flex";
                hero.className = "hero-banner is-live";
                hero.innerHTML = `
                    <div class="hero-label" style="color: var(--live);">🟢 Aktualnie trwają (${procent}%) • ${trwajace.typEtykieta}</div>
                    <div class="hero-title">${trwajace.czystaNazwa}</div>
                    <div style="font-size: 0.85rem; color: var(--muted);">${trwajace.salaTekst} ${trwajace.prowadzacy ? '• 👨‍🏫 ' + trwajace.prowadzacy : ''} • Koniec za: <b style="color:var(--live)">${formatujOdliczanie(trwajace.end - teraz)}</b></div>
                `;
            } else if (nastepne) {
                hero.style.display = "flex";
                hero.className = "hero-banner is-next";
                hero.innerHTML = `
                    <div class="hero-label" style="color: var(--next);">⏳ Kolejne zajęcia (${nastepne.typEtykieta}) za:</div>
                    <div class="hero-timer" style="color: var(--next);">${formatujOdliczanie(nastepne.start - teraz)}</div>
                    <div class="hero-title">${nastepne.czystaNazwa}</div>
                    <div style="font-size: 0.85rem; color: var(--muted);">${nastepne.salaTekst} ${nastepne.prowadzacy ? '• 👨‍🏫 ' + nastepne.prowadzacy : ''} • 🕒 ${nastepne.start.toLocaleDateString('pl-PL', {weekday: 'short', day: 'numeric', month: 'short'})} ${nastepne.start.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'})}</div>
                `;
            } else hero.style.display = "none";
        }

        async function pobierzPlan() {
            const statusEl = document.getElementById("status");
            statusEl.textContent = "Pobieranie planu...";
            try {
                const res = await fetch("./plan.ics?t=" + Date.now());
                if (!res.ok) throw new Error("Brak pliku plan.ics");
                const icsText = await res.text();
                localStorage.setItem("usos_ics_cache", icsText);
                localStorage.setItem("usos_last_sync", new Date().toLocaleString('pl-PL'));
                WSZYSTKIE_ZAJECIA = parsujICS(icsText);
                inicjalizujMiesiace();
                wyswietlPlan();
                statusEl.textContent = `✅ Zsynchronizowano: ${localStorage.getItem("usos_last_sync")}`;
            } catch (err) {
                const cache = localStorage.getItem("usos_ics_cache");
                if (cache) {
                    WSZYSTKIE_ZAJECIA = parsujICS(cache);
                    inicjalizujMiesiace();
                    wyswietlPlan();
                    statusEl.textContent = `⚡ Tryb offline (zapisano: ${localStorage.getItem("usos_last_sync")})`;
                } else statusEl.textContent = "⏳ Czekam na wygenerowanie pliku plan.ics w zakładce Actions...";
            }
        }

        /* ----- ZAAWANSOWANA OBSŁUGA PRZESUWANIA (SWIPE I MYSZKA) ----- */
        let startX = 0, startY = 0, endX = 0, endY = 0;
        let isMouseDown = false;
        const appScreen = document.getElementById("app-screen");

        function handleGesture() {
            const xDiff = endX - startX;
            const yDiff = endY - startY;
            // Sprawdzamy, czy ruch był bardziej w poziomie niż w pionie i czy był wystarczająco długi (> 50px)
            if (Math.abs(xDiff) > Math.abs(yDiff) && Math.abs(xDiff) > 50) {
                if (xDiff < 0) {
                    zmienMiesiac(1); // Swipe w lewo (następny)
                } else {
                    zmienMiesiac(-1); // Swipe w prawo (poprzedni)
                }
            }
        }

        // Obsługa dotyku (telefony)
        appScreen.addEventListener('touchstart', e => {
            startX = e.changedTouches[0].screenX;
            startY = e.changedTouches[0].screenY;
        }, { passive: true });

        appScreen.addEventListener('touchend', e => {
            endX = e.changedTouches[0].screenX;
            endY = e.changedTouches[0].screenY;
            handleGesture();
        }, { passive: true });

        // Obsługa myszki (komputery)
        appScreen.addEventListener('mousedown', e => {
            isMouseDown = true;
            startX = e.screenX;
            startY = e.screenY;
        });

        appScreen.addEventListener('mouseup', e => {
            if (!isMouseDown) return;
            isMouseDown = false;
            endX = e.screenX;
            endY = e.screenY;
            handleGesture();
        });

        appScreen.addEventListener('mouseleave', e => {
            isMouseDown = false;
        });

        window.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem(STORAGE_AUTH_KEY) === "true") uruchomAplikacje();
        });
    </script>
</body>
</html>
