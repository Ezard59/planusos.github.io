<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Zajęć USOS</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            gap: 14px;
            text-align: center;
        }
        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 28px 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input[type="password"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        input[type="password"]:focus {
            border-color: var(--accent);
        }
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            display: none;
        }
        #app-screen { display: none; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: 1.35rem; }
        .btn-group { display: flex; gap: 8px; }
        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button.btn-logout {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        button:active { opacity: 0.8; }
        .status {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .day-group { margin-bottom: 24px; }
        .day-header {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .event-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .event-time {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
        }
        .event-title {
            font-size: 1.05rem;
            font-weight: 600;
        }
        .event-meta {
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 Dostęp do planu</h2>
            <p style="font-size: 0.85rem; color: var(--muted);">Wpisz hasło jednorazowo, aby odblokować i zapamiętać urządzenie.</p>
            <input type="password" id="pass-input" placeholder="Hasło..." autocapitalize="none" autocorrect="off" onkeydown="if(event.key==='Enter') zaloguj()">
            <div id="login-error" class="error-msg">Nieprawidłowe hasło!</div>
            <button type="button" onclick="zaloguj()">Odblokuj</button>
        </div>
    </div>

    <!-- EKRAN PLANU ZAJĘĆ -->
    <div id="app-screen">
        <header>
            <h1>🎓 Mój Plan USOS</h1>
            <div class="btn-group">
                <button type="button" onclick="pobierzPlan()">Odśwież</button>
                <button type="button" class="btn-logout" onclick="wyloguj()">Wyloguj</button>
            </div>
        </header>

        <div id="status" class="status">Ładowanie planu...</div>
        <div id="plan-container"></div>
    </div>

    <script>
        // Zaszyfrowane bajty Twojego linku
        const ENCRYPTED_BYTES = [
            4,27,24,65,65,9,67,67,25,2,83,95,83,82,30,68,26,3,74,6,87,65,24,78,24,65,30,77,15,29,76,86,
            23,30,83,76,25,65,78,76,20,83,83,29,14,12,18,0,28,3,67,27,24,72,21,82,25,12,14,91,82,2,10,
            27,31,15,25,1,69,8,125,87,74,90,94,30,72,38,113,1,42,41,89,1,24,43,38,125,38,10,98,53
        ];
        const STORAGE_AUTH_KEY = "usos_saved_pass_v2";
        let AKTYWNY_URL = "";

        function odszyfrujUrl(haslo) {
            if (!haslo) return null;
            // Usuwamy przypadkowe spacje i zamieniamy pierwszą literę na małą (gdyby klawiatura w telefonie zmieniła na "Lol123")
            const czysteHaslo = haslo.trim().toLowerCase();
            let wynik = "";
            for (let i = 0; i < ENCRYPTED_BYTES.length; i++) {
                wynik += String.fromCharCode(ENCRYPTED_BYTES[i] ^ czysteHaslo.charCodeAt(i % czysteHaslo.length));
            }
            if (wynik.startsWith("https://usosapps.vistula.edu.pl/")) {
                return wynik;
            }
            return null;
        }

        function zaloguj() {
            const input = document.getElementById("pass-input").value;
            const errorEl = document.getElementById("login-error");
            const url = odszyfrujUrl(input);

            if (url) {
                errorEl.style.display = "none";
                localStorage.setItem(STORAGE_AUTH_KEY, input.trim().toLowerCase());
                uruchomAplikacje(url);
            } else {
                errorEl.style.display = "block";
            }
        }

        function wyloguj() {
            localStorage.removeItem(STORAGE_AUTH_KEY);
            document.getElementById("pass-input").value = "";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
        }

        function uruchomAplikacje(odszyfrowanyUrl) {
            AKTYWNY_URL = odszyfrowanyUrl;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";

            const zapisany = localStorage.getItem("usos_ics_cache");
            if (zapisany) {
                wyswietlPlan(parsujICS(zapisany));
            }
            pobierzPlan();
        }

        function parsujDateICal(icalStr) {
            const czystaData = icalStr.split(':').pop().trim();
            const r = parseInt(czystaData.substring(0, 4), 10);
            const m = parseInt(czystaData.substring(4, 6), 10) - 1;
            const d = parseInt(czystaData.substring(6, 8), 10);
            const godz = parseInt(czystaData.substring(9, 11) || "0", 10);
            const min = parseInt(czystaData.substring(11, 13) || "0", 10);
            return new Date(r, m, d, godz, min);
        }

        function parsujICS(icsText) {
            const unfolded = icsText.replace(/\r?\n[ \t]/g, '');
            const lines = unfolded.split(/\r?\n/);
            
            const zajecia = [];
            let obecne = null;

            for (let line of lines) {
                if (line === "BEGIN:VEVENT") {
                    obecne = {};
                } else if (line === "END:VEVENT" && obecne) {
                    if (obecne.start && obecne.summary) {
                        zajecia.push(obecne);
                    }
                    obecne = null;
                } else if (obecne) {
                    if (line.startsWith("SUMMARY:")) {
                        obecne.summary = line.substring(8).replace(/\\,/g, ',');
                    } else if (line.startsWith("LOCATION:")) {
                        obecne.location = line.substring(9).replace(/\\,/g, ',');
                    } else if (line.startsWith("DESCRIPTION:")) {
                        obecne.description = line.substring(12).replace(/\\n/g, ' | ').replace(/\\,/g, ',');
                    } else if (line.startsWith("DTSTART")) {
                        obecne.start = parsujDateICal(line);
                    } else if (line.startsWith("DTEND")) {
                        obecne.end = parsujDateICal(line);
                    }
                }
            }
            return zajecia.sort((a, b) => a.start - b.start);
        }

        function wyswietlPlan(zajecia) {
            const container = document.getElementById("plan-container");
            container.innerHTML = "";

            if (zajecia.length === 0) {
                container.innerHTML = "<p>Brak nadchodzących zajęć w najbliższym czasie.</p>";
                return;
            }

            const grupy = {};
            zajecia.forEach(z => {
                const kluczDnia = z.start.toLocaleDateString('pl-PL', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });
                if (!grupy[kluczDnia]) grupy[kluczDnia] = [];
                grupy[kluczDnia].push(z);
            });

            for (const [dzien, lista] of Object.entries(grupy)) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day-group";
                dayDiv.innerHTML = `<div class="day-header">${dzien}</div>`;

                lista.forEach(z => {
                    const startGodz = z.start.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
                    const endGodz = z.end ? z.end.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) : "";
                    
                    const card = document.createElement("div");
                    card.className = "event-card";
                    card.innerHTML = `
                        <div class="event-time">🕒 ${startGodz} - ${endGodz}</div>
                        <div class="event-title">${z.summary}</div>
                        <div class="event-meta">
                            <span>📍 ${z.location || 'Brak sali'}</span>
                            ${z.description ? `<span>ℹ️ ${z.description}</span>` : ''}
                        </div>
                    `;
                    dayDiv.appendChild(card);
                });

                container.appendChild(dayDiv);
            }
        }

        // Pobieranie z obsługą zapasowego proxy na wypadek awarii pierwszego
        async function pobierzZProxy(url) {
            const proxies = [
                "https://corsproxy.io/?" + encodeURIComponent(url),
                "https://api.allorigins.win/raw?url=" + encodeURIComponent(url)
            ];
            for (const p of proxies) {
                try {
                    const res = await fetch(p);
                    if (res.ok) {
                        const text = await res.text();
                        if (text.includes("BEGIN:VCALENDAR")) return text;
                    }
                } catch (e) {}
            }
            throw new Error("Wszystkie serwery proxy zawiodły");
        }

        async function pobierzPlan() {
            const statusEl = document.getElementById("status");
            statusEl.textContent = "Pobieranie najnowszego planu z USOS...";

            try {
                const icsText = await pobierzZProxy(AKTYWNY_URL);
                
                localStorage.setItem("usos_ics_cache", icsText);
                localStorage.setItem("usos_last_sync", new Date().toLocaleString('pl-PL'));

                const zajecia = parsujICS(icsText);
                wyswietlPlan(zajecia);
                statusEl.textContent = `Ostatnia aktualizacja: ${localStorage.getItem("usos_last_sync")}`;
            } catch (err) {
                const cache = localStorage.getItem("usos_ics_cache");
                if (cache) {
                    wyswietlPlan(parsujICS(cache));
                    statusEl.textContent = `Tryb offline (dane z: ${localStorage.getItem("usos_last_sync")})`;
                } else {
                    statusEl.textContent = "Nie udało się pobrać planu. Sprawdź połączenie z internetem.";
                }
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const zapisaneHaslo = localStorage.getItem(STORAGE_AUTH_KEY);
            if (zapisaneHaslo) {
                const url = odszyfrujUrl(zapisaneHaslo);
                if (url) {
                    uruchomAplikacje(url);
                }
            }
        });
    </script>
</body>
</html>
