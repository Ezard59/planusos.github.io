<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Zajęć USOS</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        /* Ekran logowania */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            gap: 14px;
            text-align: center;
        }
        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 28px 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input[type="password"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        input[type="password"]:focus {
            border-color: var(--accent);
        }
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            display: none;
        }
        /* Główna aplikacja */
        #app-screen { display: none; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: 1.35rem; }
        .btn-group { display: flex; gap: 8px; }
        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button.btn-logout {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        button:active { opacity: 0.8; }
        .status {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .day-group { margin-bottom: 24px; }
        .day-header {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .event-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .event-time {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
        }
        .event-title {
            font-size: 1.05rem;
            font-weight: 600;
        }
        .event-meta {
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 Dostęp do planu</h2>
            <p style="font-size: 0.85rem; color: var(--muted);">Wpisz hasło jednorazowo, aby odblokować i zapamiętać urządzenie.</p>
            <input type="password" id="pass-input" placeholder="Hasło..." onkeydown="if(event.key==='Enter') zaloguj()">
            <div id="login-error" class="error-msg">Nieprawidłowe hasło!</div>
            <button onclick="zaloguj()">Odblokuj</button>
        </div>
    </div>

    <!-- EKRAN PLANU ZAJĘĆ -->
    <div id="app-screen">
        <header>
            <h1>🎓 Mój Plan USOS</h1>
            <div class="btn-group">
                <button onclick="pobierzPlan()">Odśwież</button>
                <button class="btn-logout" onclick="wyloguj()" title="Wyloguj z tego urządzenia">Wyloguj</button>
            </div>
        </header>

        <div id="status" class="status">Ładowanie planu...</div>
        <div id="plan-container"></div>
    </div>

    <script>
        // Twój link zaszyfrowany hasłem "lol123" (nikt nie podejrzy klucza w kodzie strony)
        const ENCRYPTED_URL = "BBQGGh9WWB0cHQwbQh5aHRYdGBNBWlVZAgcQWltfHB9ZHx0VGR9UXwIaGh8fXUJdGgNXXA4cBFpWQwoPG1FBEhMaVQoAAwE9LyY1L1x5IConIhcwPyUoO2MXBw==";
        const STORAGE_AUTH_KEY = "usos_saved_pass";

        // Funkcja deszyfrująca link za pomocą podanego hasła
        function odszyfrujUrl(haslo) {
            try {
                const raw = atob(ENCRYPTED_URL);
                let wynik = "";
                for (let i = 0; i < raw.length; i++) {
                    wynik += String.fromCharCode(raw.charCodeAt(i) ^ haslo.charCodeAt(i % haslo.length));
                }
                // Sprawdzamy, czy po odszyfrowaniu otrzymaliśmy poprawny link do USOS-a
                if (wynik.startsWith("https://usosapps.vistula.edu.pl/")) {
                    return wynik;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        function zaloguj() {
            const input = document.getElementById("pass-input").value;
            const errorEl = document.getElementById("login-error");
            const url = odszyfrujUrl(input);

            if (url) {
                errorEl.style.display = "none";
                localStorage.setItem(STORAGE_AUTH_KEY, input); // Zapamiętaj mnie
                uruchomAplikacje(url);
            } else {
                errorEl.style.display = "block";
            }
        }

        function wyloguj() {
            localStorage.removeItem(STORAGE_AUTH_KEY);
            document.getElementById("pass-input").value = "";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
        }

        let AKTYWNY_URL = "";

        function uruchomAplikacje(odszyfrowanyUrl) {
            AKTYWNY_URL = odszyfrowanyUrl;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";

            const zapisany = localStorage.getItem("usos_ics_cache");
            if (zapisany) {
                wyswietlPlan(parsujICS(zapisany));
            }
            pobierzPlan();
        }

        // Parsowanie daty z formatu iCal
        function parsujDateICal(icalStr) {
            const czystaData = icalStr.split(':').pop().trim();
            const r = czystaData.substring(0, 4);
            const m = czystaData.substring(4, 6) - 1;
            const d = czystaData.substring(6, 8);
            const godz = czystaData.substring(9, 11) || "00";
            const min = czystaData.substring(11, 13) || "00";
            return new Date(r, m, d, godz, min);
        }
