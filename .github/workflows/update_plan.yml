name: Aktualizacja Planu USOS

on:
  schedule:
    - cron: '0 */4 * * *' # Automatycznie co 4 godziny
  workflow_dispatch:      # Pozwala kliknąć "Run workflow" ręcznie

permissions:
  contents: write

jobs:
  pobierz-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pobierz plik .ics prosto z USOS Vistula
        env:
          ICAL_LINK: ${{ secrets.USOS_URL }}
        run: |
          curl -sS -L "$ICAL_LINK" -o plan.ics

      - name: Zapisz zaktualizowany plan w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plan.ics
          git diff --staged --quiet || git commit -m "Aktualizacja planu USOS"
          git push
